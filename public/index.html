<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>FriendZone</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#2463cc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="conn" class="conn hidden">Connecting…</div>
  <div class="top-ctl">
    <button id="chatBtn" class="touch-only" aria-label="Chat">💬</button>
    <button id="muteBtn" aria-label="Mute">🔊</button>
    <button id="settingsBtn" aria-label="Settings" title="Settings"></button>
  </div>

  <!-- Home: pick one of your zones or make a new one -->
  <section id="home" class="screen">
    <img class="logo-mark" src="icon.svg" alt="" width="84" height="84">
    <h1 class="logo" aria-label="FRIEND ZONE"><span data-text="FRIEND">FRIEND</span><span data-text="ZONE">ZONE</span></h1>
    <p class="tagline">Your group's own little online world.</p>
    <div class="card narrow">
      <h2>Your FriendZones</h2>
      <ul id="myZones" class="zone-list"></ul>
      <p id="noZones" class="muted">You're not in any zones yet. Create one for your group, or join a friend's with their code.</p>
    </div>
    <div class="row">
      <button class="btn primary" data-go="create">＋ Create a FriendZone</button>
      <button class="btn" data-go="join">Join with a code</button>
    </div>
  </section>

  <section id="create" class="screen hidden">
    <h1 class="logo small" aria-label="NEW ZONE"><span data-text="NEW">NEW</span><span data-text="ZONE">ZONE</span></h1>
    <form id="createForm" class="card narrow form" autocomplete="off">
      <label>Zone name<input name="zoneName" maxlength="24" required placeholder="The Squad"></label>
      <label>Your name<input name="name" maxlength="16" required placeholder="Jun"></label>
      <label>PIN <small>4–6 digits, used to sign in on other devices</small>
        <input name="pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required></label>
      <div class="field-label">Your color</div>
      <div class="swatches"></div>
      <p class="error"></p>
      <button class="btn primary">Create zone</button>
      <button type="button" class="btn ghost" data-go="home">Back</button>
    </form>
  </section>

  <section id="join" class="screen hidden">
    <h1 class="logo small" aria-label="JOIN ZONE"><span data-text="JOIN">JOIN</span><span data-text="ZONE">ZONE</span></h1>
    <form id="joinForm" class="card narrow form" autocomplete="off">
      <label>Invite code<input name="code" maxlength="8" required placeholder="ABC123" class="code-input"></label>
      <label>Your name<input name="name" maxlength="16" required placeholder="Dani"></label>
      <label>PIN <small>new here? pick one. returning? use yours</small>
        <input name="pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required></label>
      <div class="field-label">Your color <small>(new members)</small></div>
      <div class="swatches"></div>
      <p class="error"></p>
      <button class="btn primary">Join</button>
      <button type="button" class="btn ghost" data-go="home">Back</button>
    </form>
  </section>

  <!-- Lobby: the zone's front page -->
  <section id="lobby" class="screen hidden">
    <h1 class="logo" aria-label="FRIEND ZONE"><span data-text="FRIEND">FRIEND</span><span data-text="ZONE">ZONE</span></h1>
    <div class="zone-title" id="lobbyZone"></div>
    <button class="code-pill" id="inviteBtn">Invite code <b id="lobbyCode"></b> · copy link</button>
    <div class="lobby-grid">
      <div class="card">
        <h2 class="online-title">ONLINE: <span id="onlineCount">0</span></h2>
        <ul id="memberList" class="members"></ul>
      </div>
      <div class="card profile" id="profileCard"></div>
    </div>
    <button class="btn primary play" id="playBtn">PLAY</button>
    <div class="card wide-card">
      <h2>Zone news</h2>
      <ul id="lobbyFeed" class="feed"></ul>
    </div>
    <button class="btn ghost" id="switchZone">Switch zone</button>
  </section>

  <!-- World: walk around together -->
  <section id="world" class="screen hidden">
    <canvas id="worldCanvas"></canvas>
    <div id="worldLabels" class="world-labels hidden"></div>
    <div class="hud-top">
      <button class="btn small" id="backLobby">← Lobby</button>
      <div class="hud-me" id="hudMe"></div>
    </div>
    <div class="hud-online" id="hudOnline"></div>
    <canvas class="minimap" id="minimap" title="Map (M)"></canvas>
    <div class="hud-clock" id="hudClock"></div>
    <div class="hud-prompt hidden" id="hudPrompt"></div>
    <div class="chat">
      <ul id="chatLog"></ul>
      <div class="emote-bar" id="emoteBar"></div>
      <form id="chatForm"><input id="chatInput" maxlength="140" placeholder="Enter to chat · 1-6 to emote · Shift to run" autocomplete="off"></form>
    </div>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
